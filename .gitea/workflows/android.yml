# Kalimote APK build and release for Gitea Actions (act_runner), typically on a
# pull mirror of the GitHub repository. Gitea runs workflows from
# .gitea/workflows and then ignores .github/workflows, which remain GitHub's.
#
# Runner: an x86_64 act_runner whose `ubuntu-latest` label maps to an image
# with Node (gitea/runner-images:ubuntu-latest or catthehacker/ubuntu:act-latest).
# Java and the Android SDK are installed by the steps below.
#
# - Each sync of main: tests and builds the APK (a run artifact).
# - Each v* tag: also publishes the Gitea release for that tag with the signed
#   APK and checksums. Tags come from GitHub: tag or run the Release workflow
#   there, and when the mirror syncs the tag Gitea fires a push event for it.
#   A tag made on the mirror itself would be deleted by its next sync.
#   GitHub asks the mirror to sync right after releasing when its
#   GITEA_SYNC_TOKEN secret is set; otherwise the mirror interval picks it up.
#
# Secrets (Settings → Actions → Secrets), the same as on GitHub:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD  (required for v* tags)
#   RELEASE_TOKEN (optional): a token with write:repository, if the automatic
#   Actions token may not create releases.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  # Run on a branch to build, or on a v* tag to (re)publish its release.
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Releases are part of "contents". Gitea >= 1.26 honours this even when the
# instance defaults Actions tokens to "restricted"; older versions ignore it.
permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate. Every release APK is checked
  # against it so users can always upgrade in place. Public; safe to commit.
  SIGNING_CERT_SHA256: 91:D2:7B:32:03:C4:64:C6:CF:7A:4F:AB:8A:F8:E1:2C:C4:8D:D7:D2:98:52:CA:90:65:76:3C:81:04:D1:1B:A1
  # Google's mirror of Maven Central: avoids Maven Central's per-IP rate limits (HTTP 429) on runners.
  KALIMOTE_MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full URLs, so actions resolve from github.com whatever the instance's
      # DEFAULT_ACTIONS_URL is.
      - uses: https://github.com/actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/}"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Release $tag" ;;
            *)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Build only ($GITHUB_REF)" ;;
          esac

      - uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 22
      # Runner images don't carry the Android SDK; the Gradle plugin fetches the
      # platform and build tools it needs once the licences are accepted.
      - uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: https://github.com/actions/cache@v4
        continue-on-error: true # a cache server hiccup must not fail the build
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The protocol library's integration tests talk to the Node.js mock TVs.
      - run: npm ci
        working-directory: server

      # The stable release key: phones only install an update signed with the
      # same key as the installed app. Tag builds refuse to run without it;
      # branch builds fall back to the debug key.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ steps.version.outputs.release }}" = "true" ]; then
              echo "::error::Missing KEYSTORE_BASE64 secret: add the four signing secrets (Settings → Actions → Secrets)."
              exit 1
            fi
            echo "::warning::No signing key: this build uses the debug key and can't update an installed copy."
            exit 0
          fi
          mkdir -p "$HOME/.kalimote"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.kalimote/release.jks"
          echo "KALIMOTE_KEYSTORE_FILE=$HOME/.kalimote/release.jks" >> "$GITHUB_ENV"

      - name: Test and build APK
        working-directory: android
        env:
          KALIMOTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KALIMOTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KALIMOTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --stacktrace :atvremote:test :app:assembleRelease ${VERSION:+-Pkalimote.versionName=$VERSION}

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            name="kalimote-${{ steps.version.outputs.version }}"
          else
            name="kalimote-${GITHUB_SHA:0:7}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      # Same key on both forges, or updates stop installing: never publish anything else.
      - name: Check signing certificate
        if: steps.version.outputs.release == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs dist/*.apk | tee "$HOME/certs.txt"
          actual=$(grep -m1 'certificate SHA-256 digest' "$HOME/certs.txt" | awk '{print $NF}')
          expected=$(echo "$SIGNING_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signed with $actual, expected $expected"
            exit 1
          fi

      # Gitea identifies as GHES, which upload-artifact@v4 refuses; v3 works with Gitea's artifact API.
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: kalimote-apk
          path: dist/

      - name: Publish Gitea release
        if: steps.version.outputs.release == 'true'
        env:
          GITEA_URL: ${{ github.server_url }}
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Install"
            echo "Download \`kalimote-$VERSION.apk\` on your Android phone (Android 8.0+) and open it; allow installing from your browser if asked."
            echo
            echo "**Signing certificate SHA-256:** \`$SIGNING_CERT_SHA256\`"
            echo "Check with \`apksigner verify --print-certs kalimote-$VERSION.apk\`."
            echo
            echo "---"
            echo "Built on Gitea from commit ${GITHUB_SHA:0:7} by run $GITHUB_RUN_NUMBER."
          } > "$HOME/notes.md"
          node .gitea/release.mjs "$TAG" "Kalimote $VERSION" "$HOME/notes.md" "dist/kalimote-$VERSION.apk" dist/SHA256SUMS.txt
