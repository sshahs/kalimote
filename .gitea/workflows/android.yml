name: Android

# Gitea Actions (act_runner) build and release of the Android APK. Gitea runs
# workflows from .gitea/workflows and then ignores .github/workflows, which
# remain GitHub's.
#
# - Every push to main: tests, then builds the APK (uploaded as an artifact).
# - A v* tag (pushed, or arriving through a pull mirror's sync), or a manual
#   run with a version: also publishes a Gitea release with the signed APK.
#
# Secrets (repository settings → Actions → Secrets), the same as on GitHub:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Optional: RELEASE_TOKEN, a token with repository write access, if the
# runner's automatic token is not allowed to create releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.8.0). Leave empty to only build.
        required: false

env:
  # SHA-256 of the release signing certificate. Every release APK is checked
  # against it so users can always upgrade in place. Public; safe to commit.
  SIGNING_CERT_SHA256: FB:E9:69:48:AB:5B:42:99:D6:F7:79:33:71:DD:6E:D2:43:C9:DD:8B:53:BE:E9:84:CA:12:99:5F:5F:70:13:8A

jobs:
  apk:
    # act_runner's default label. Any of its images works: Java and the Android
    # SDK are installed by the steps below.
    runs-on: ubuntu-latest
    steps:
      # Full URLs so the actions resolve from github.com whatever the
      # instance's DEFAULT_ACTIONS_URL is.
      - uses: https://github.com/actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          v=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF#refs/tags/}" ;; esac
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version: ${v:-none (build only)}"

      - uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 22
      # The runner image has no Android SDK; this installs it and accepts the
      # licences, and the Android Gradle plugin downloads what the build needs.
      - uses: https://github.com/android-actions/setup-android@v3

      # The protocol library's integration tests talk to the Node.js mock TVs.
      - run: npm ci
        working-directory: server

      # The stable release key. Releases refuse to build without it, so a
      # debug-signed APK (which can't upgrade an installed copy) never ships.
      # Plain builds without it fall back to the debug key.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ steps.version.outputs.release }}" = "true" ]; then
              echo "::error::Missing KEYSTORE_BASE64 secret. See README → Releasing."
              exit 1
            fi
            echo "No signing key: building with the debug key."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KALIMOTE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build APK
        working-directory: android
        env:
          KALIMOTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KALIMOTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KALIMOTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon :atvremote:test :app:assembleRelease ${VERSION:+-Pkalimote.versionName=$VERSION}

      - name: Verify APK signature
        if: steps.version.outputs.release == 'true'
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          actual=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          expected=$(echo "$SIGNING_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signed with $actual, expected $expected"
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          name="kalimote-${{ steps.version.outputs.version }}"
          [ "${{ steps.version.outputs.release }}" = "true" ] || name="kalimote-${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      # v3: Gitea's artifact service doesn't speak v4's protocol on older releases.
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: kalimote-apk
          path: dist/

      - name: Publish Gitea release
        if: steps.version.outputs.release == 'true'
        env:
          GITEA_URL: ${{ github.server_url }}
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install
          Download \`kalimote-$VERSION.apk\` on your Android phone (Android 8.0+) and open it; allow installing from your browser if asked.

          **Signing certificate SHA-256:** \`$SIGNING_CERT_SHA256\`
          Check with \`apksigner verify --print-certs kalimote-$VERSION.apk\`.
          EOF
          node .gitea/release.mjs "${{ steps.version.outputs.tag }}" "$GITHUB_SHA" "Kalimote $VERSION" "$RUNNER_TEMP/notes.md" \
            "dist/kalimote-$VERSION.apk" dist/SHA256SUMS.txt
