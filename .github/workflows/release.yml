name: Release

# Publishes a GitHub Release with the Android APK.
# Trigger by pushing a tag (git tag v1.2.3 && git push origin v1.2.3)
# or run manually from the Actions tab with a version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true

permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate. Every release APK is checked
  # against it so users can always upgrade in place. Public; safe to commit.
  SIGNING_CERT_SHA256: 91:D2:7B:32:03:C4:64:C6:CF:7A:4F:AB:8A:F8:E1:2C:C4:8D:D7:D2:98:52:CA:90:65:76:3C:81:04:D1:1B:A1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME}"; fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - uses: gradle/actions/setup-gradle@v4

      # The stable release key, from secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD. Releases refuse to build without it, so a
      # debug-signed APK (which can't upgrade an installed copy) never ships.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See README → Releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KALIMOTE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        working-directory: android
        env:
          KALIMOTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KALIMOTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KALIMOTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon :atvremote:test :app:assembleRelease
          -Pkalimote.versionName=${{ steps.version.outputs.version }}

      - name: Verify APK signature
        id: cert
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          actual=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          expected=$(echo "$SIGNING_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signed with $actual, expected $expected"
            exit 1
          fi
          echo "sha256=$SIGNING_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Collect APK
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kalimote-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kalimote ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install
            Download `kalimote-${{ steps.version.outputs.version }}.apk` on your Android phone (Android 8.0+) and open it; allow installing from your browser if asked.

            The web remote runs from source: see the [README](https://github.com/${{ github.repository }}#-web-remote).

            **Signing certificate SHA-256:** `${{ steps.cert.outputs.sha256 }}`
            Check with `apksigner verify --print-certs kalimote-${{ steps.version.outputs.version }}.apk`.
          files: |
            dist/kalimote-${{ steps.version.outputs.version }}.apk
            dist/SHA256SUMS.txt

      # Asks the Gitea mirror to sync now, so its release build starts right away
      # instead of at the next mirror interval. Optional, never fails the release:
      # needs the GITEA_SYNC_TOKEN secret (a Gitea token with write:repository) and
      # the GITEA_MIRROR variable (the mirror's URL, e.g. https://gitea.example.com/owner/kalimote).
      - name: Sync Gitea mirror
        env:
          GITEA_SYNC_TOKEN: ${{ secrets.GITEA_SYNC_TOKEN }}
          GITEA_MIRROR: ${{ vars.GITEA_MIRROR }}
        run: |
          if [ -z "$GITEA_SYNC_TOKEN" ] || [ -z "$GITEA_MIRROR" ]; then
            echo "No GITEA_SYNC_TOKEN / GITEA_MIRROR: a Gitea mirror picks this up at its next scheduled sync."
            exit 0
          fi
          url="${GITEA_MIRROR%/}"; base="${url%/*/*}"
          api="$base/api/v1/repos/${url#"$base"/}/mirror-sync"
          code=$(curl -sS -m 30 -o /tmp/sync.json -w '%{http_code}' -X POST -H "Authorization: token $GITEA_SYNC_TOKEN" "$api") || code=000
          case "$code" in
            200|204) echo "Gitea mirror sync requested ($api)." ;;
            401|403) echo "::warning::Gitea refused the mirror sync (HTTP $code): GITEA_SYNC_TOKEN needs write:repository on the mirror." ;;
            *) echo "::warning::Gitea mirror sync failed (HTTP $code): $(head -c 300 /tmp/sync.json 2>/dev/null)" ;;
          esac
